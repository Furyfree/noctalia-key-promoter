id = "furyfree/key-promoter"
name = "Key Promoter"
version = "0.2.0"
plugin_api = 30
author = "furyfree"
license = "MIT"
dependencies = ["hyprctl", "socat", "stdbuf"]
tags = ["utility", "hyprland"]
icon = "keyboard"
description = "Shows the Hyprland shortcut when you open an app or switch workspace with the mouse."

[[setting]]
key = "app_launches"
type = "bool"
label_key = "settings.app_launches.label"
description_key = "settings.app_launches.description"
default = true

[[setting]]
key = "workspace_switches"
type = "bool"
label_key = "settings.workspace_switches.label"
description_key = "settings.workspace_switches.description"
default = true

[[setting]]
key = "suggest_after"
type = "int"
label_key = "settings.suggest_after.label"
description_key = "settings.suggest_after.description"
default = 5
min = 0
max = 50
step = 1

[[setting]]
key = "suggest_period"
type = "select"
label_key = "settings.suggest_period.label"
description_key = "settings.suggest_period.description"
default = "day"
options = [
    { value = "hour", label_key = "settings.suggest_period.hour" },
    { value = "day", label_key = "settings.suggest_period.day" },
    { value = "week", label_key = "settings.suggest_period.week" },
    { value = "month", label_key = "settings.suggest_period.month" },
]

[[setting]]
key = "ignore"
type = "string_list"
label_key = "settings.ignore.label"
description_key = "settings.ignore.description"
default = []

[[setting]]
key = "notifications"
type = "bool"
label_key = "settings.notifications.label"
description_key = "settings.notifications.description"
default = false

[[service]]
id = "service"
entry = "service.luau"

# The hint box, one entry per row count: persistent panels have a fixed height,
# so the service swaps between them as hints come and go. They stay out of the
# one-panel slot and never take keyboard focus.
[[panel]]
id = "hint-box-1"
entry = "toast.luau"
width = 380
height = 56
placement = "floating"
position = "bottom_right"
layer = "overlay"
persistent = true
keyboard_focus = "none"
dismiss_on_outside_click = false

[[panel]]
id = "hint-box-2"
entry = "toast.luau"
width = 380
height = 92
placement = "floating"
position = "bottom_right"
layer = "overlay"
persistent = true
keyboard_focus = "none"
dismiss_on_outside_click = false

[[panel]]
id = "hint-box-3"
entry = "toast.luau"
width = 380
height = 128
placement = "floating"
position = "bottom_right"
layer = "overlay"
persistent = true
keyboard_focus = "none"
dismiss_on_outside_click = false
